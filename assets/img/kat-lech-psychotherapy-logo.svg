<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kat Lech Psychotherapy wordmark, stacked lockup.

  The supplied export used live text — Didot for the name, Helvetica Neue for
  the strapline — with each letter pinned to an x-coordinate calculated for
  those fonts. Didot ships only on macOS, so on Windows, Android and Linux the
  name fell back to a default serif and broke apart, rendering as "Kat Le ch".

  This version keeps the same lockup but survives font substitution: each line
  is one flowing text run with a fallback stack and a fixed textLength, so it
  occupies the same width whichever font resolves. The strapline's tracking is
  produced by textLength rather than by per-letter letter-spacing, which is
  what makes it hold together.

  The proper fix is a re-export from Illustrator with Type > Create Outlines
  applied. Save it over this file and no markup needs to change.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846.34 252.63"
     role="img" aria-label="Kat Lech Psychotherapy">
  <text x="12.26" y="161.61" fill="#2e2f2f" font-size="200"
        font-family="Didot, 'Bodoni 72', 'Playfair Display', Georgia, 'Times New Roman', serif"
        textLength="820" lengthAdjust="spacingAndGlyphs">Kat Lech</text>
  <text x="76.62" y="234.61" fill="#2e2f2f" font-size="50" font-weight="300"
        font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif"
        textLength="723" lengthAdjust="spacing">PSYCHOTHERAPY</text>
</svg>
