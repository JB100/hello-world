<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kat Lech Psychotherapy wordmark.

  The supplied export used live text in Helvetica Neue with each letter group
  pinned to an absolute x-coordinate. On any machine without that font (all
  Windows, most Android) it fell back to a serif and "Psychotherapy" split
  into "Psychothe rapy". The original export is preserved in git history.

  This version keeps the same wordmark but survives font substitution: one
  flowing text run instead of pinned fragments, a fallback stack, and
  textLength so the mark occupies the same width whichever font resolves.

  The proper fix is a re-export with the text converted to outlines. Drop that
  file in here under the same name and none of the markup needs to change.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1956.72 211.03"
     role="img" aria-label="Kat Lech Psychotherapy">
  <text x="6.42" y="166.09" fill="#2e2f2f" font-size="180"
        font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif"
        textLength="1943" lengthAdjust="spacingAndGlyphs"><tspan font-weight="700">Kat Lech</tspan><tspan font-weight="300"> Psychotherapy</tspan></text>
</svg>
